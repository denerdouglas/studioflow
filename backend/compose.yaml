services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studioflow
      POSTGRES_USER: studioflow
      POSTGRES_PASSWORD: ${STUDIOFLOW_DB_PASSWORD:?defina STUDIOFLOW_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studioflow -d studioflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://studioflow:${STUDIOFLOW_DB_PASSWORD}@postgres:5432/studioflow
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?defina PUBLIC_BASE_URL}
      PORT: 8080
      UPLOAD_DIRECTORY: /app/storage
      CATALOG_BASE_URL: ${CATALOG_BASE_URL:-https://world.openfoodfacts.org}
      CATALOG_USER_AGENT: ${CATALOG_USER_AGENT:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v23.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      EMAIL_PROVIDER_URL: ${EMAIL_PROVIDER_URL:-}
      EMAIL_PROVIDER_TOKEN: ${EMAIL_PROVIDER_TOKEN:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - upload_data:/app/storage
    ports:
      - "${API_PORT:-8080}:8080"

  backup:
    image: prodrigestivill/postgres-backup-local:17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: studioflow
      POSTGRES_USER: studioflow
      POSTGRES_PASSWORD: ${STUDIOFLOW_DB_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - backup_data:/backups

volumes:
  postgres_data:
  upload_data:
  backup_data:
