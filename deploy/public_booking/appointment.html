<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu agendamento — StudioFlow</title><style>
body{margin:0;background:#f5f2f8;font:16px system-ui;color:#211b2b}.card{max-width:560px;margin:32px auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 4px 24px #0001}button,input{width:100%;padding:13px;margin-top:12px;border:1px solid #ccc;border-radius:12px;font:inherit}button{background:#70569a;color:#fff;border:0;font-weight:700}.danger{background:#a40018}.hidden{display:none}.error{color:#a40018}@media(max-width:600px){.card{margin:12px}}
</style></head><body><main class="card"><h1>Meu agendamento</h1><p id="loading">Carregando…</p><p id="error" class="error hidden"></p><section id="content" class="hidden"><div id="details"></div><button id="confirm">Confirmar presença</button><label for="date">Nova data e horário</label><input id="date" type="datetime-local"><button id="reschedule">Reagendar</button><button id="cancel" class="danger">Cancelar agendamento</button><p id="message"></p></section></main>
<script>
const api='https://api.studioflowapp.com.br';const parts=location.pathname.split('/').filter(Boolean);const token=parts[parts.length-1];const $=id=>document.getElementById(id);let current;
async function call(path,options){const r=await fetch(api+path,options);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.message||'Não foi possível concluir.');return j}
function render(){const start=new Date(current.startsAt);$('details').innerHTML=`<p><b>Status:</b> ${current.status}</p><p><b>Data:</b> ${start.toLocaleString('pt-BR')}</p>`;$('loading').classList.add('hidden');$('content').classList.remove('hidden')}
async function load(){try{current=await call('/v1/public/appointments/'+encodeURIComponent(token));render()}catch(e){$('loading').classList.add('hidden');$('error').textContent=e.message;$('error').classList.remove('hidden')}}
async function action(name,body){try{current=await call(`/v1/public/appointments/${encodeURIComponent(token)}/${name}`,{method:'POST',headers:{'content-type':'application/json'},body:body?JSON.stringify(body):null});$('message').textContent='Alteração concluída.';render()}catch(e){$('message').textContent=e.message}}
$('confirm').onclick=()=>action('confirm');$('cancel').onclick=()=>confirm('Cancelar este agendamento?')&&action('cancel');$('reschedule').onclick=()=>{const start=new Date($('date').value);if(Number.isNaN(start.valueOf()))return alert('Informe a nova data.');const duration=new Date(current.endsAt)-new Date(current.startsAt);action('reschedule',{startsAt:start.toISOString(),endsAt:new Date(start.valueOf()+duration).toISOString()})};load();
</script></body></html>
